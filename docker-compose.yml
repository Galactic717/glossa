services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    environment:
      GLOSSA_BASE_URL: http://ollama:11434
      GLOSSA_MODEL: ${GLOSSA_MODEL:-ornith:9b}
      GLOSSA_DATA_DIR: /data
    volumes:
      - data:/data
      - models:/models
    depends_on: [ollama]
    restart: unless-stopped

volumes:
  ollama:
  data:
  models:
